<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper<br>Scissors</h1>
        
        <div class="choices">
            <button class="choice-btn" id="rock">🪨<br>rock</button>
            <button class="choice-btn" id="paper">📝<br>paper</button>
            <button class="choice-btn" id="scissors">✂️<br>scissors</button>
        </div>

        <div class="result-display">
            <div class="result-top">
                <p id="player-choice">Player: </p>
                <p id="computer-choice">Computer: </p>
            </div>
             <h2 id="game-result">Choose your weapon!</h2>
        </div>

        <div class="score-board">
            <p>Player Score: <span id="player-score">0</span></p>
            <p>Computer Score: <span id="computer-score">0</span></p>
        </div>

        <button id="reset-btn">Play Again</button>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
